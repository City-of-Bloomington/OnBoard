[onboard]
user = www-data
group = www-data
listen = /run/php/onboard.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
security.limit_extensions = .php

php_admin_value[error_reporting] = 22527
php_admin_value[upload_max_filesize] = {{ onboard_max_upload_size }}
php_admin_value[post_max_size] = {{ onboard_max_upload_size }}

env[SITE_HOME] = {{ onboard_site_home }}
